<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logoPG.ico" type="image/x-icon">
    <title>Usuarios - GymControl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a1a2e; min-height: 100vh; padding: 24px 0; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 0 24px 32px; border-bottom: 1px solid #ffffff15; }
        .sidebar-logo h1 { color: #e94560; font-size: 20px; }
        .sidebar-logo p { color: #aaa; font-size: 12px; margin-top: 4px; }
        .sidebar-menu { padding: 24px 0; flex: 1; }
        .menu-item { padding: 12px 24px; color: #aaa; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all .2s; text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: #e9456015; color: #e94560; border-left: 3px solid #e94560; }
        .menu-item span { font-size: 18px; }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid #ffffff15; }
        .sidebar-footer button { width: 100%; background: transparent; border: 1px solid #e94560; color: #e94560; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .sidebar-footer button:hover { background: #e94560; color: white; }
        .main { flex: 1; padding: 32px; }
        .topbar { margin-bottom: 32px; }
        .topbar h2 { font-size: 22px; color: #1a1a2e; }
        .topbar p { color: #888; font-size: 13px; margin-top: 2px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-header h3 { font-size: 16px; color: #1a1a2e; font-weight: 600; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #e94560; }
        .btn-primary { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
        .btn-primary:hover { background: #c73652; }
        .btn-delete { background: #ffeef1; color: #e94560; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 16px; text-align: left; font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #f0f0f0; }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f9f9f9; }
        tr:hover td { background: #fafafa; }
        .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
        .msg.ok { background: #eefff5; color: #27ae60; display: block; }
        .msg.err { background: #ffeef1; color: #e94560; display: block; }
        .badge-admin { background: #ffeef1; color: #e94560; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-user { background: #eef4ff; color: #3498db; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: #e9456020; color: #e94560; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-right: 10px; }
    @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; min-height: auto; padding: 12px 0; flex-direction: row; position: fixed; bottom: 0; left: 0; z-index: 50; border-top: 1px solid #ffffff15; }
    .sidebar-logo { display: none; }
    .sidebar-menu { padding: 0; display: flex; flex-direction: row; justify-content: space-around; }
    .menu-item { flex-direction: column; padding: 8px 12px; font-size: 10px; gap: 4px; border-left: none !important; border-top: 3px solid transparent; }
    .menu-item.active { border-top: 3px solid #e94560; border-left: none; background: #e9456015; }
    .menu-item span { font-size: 22px; }
    .sidebar-footer { display: none; }
    .main { padding: 16px; padding-bottom: 80px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <h1>💪 GymControl</h1>
            <p>Panel de administración</p>
        </div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><span>👥</span> Socios</a>
            <a href="/membresias.html" class="menu-item menu-membresias"><span>💳</span> Membresías</a>
<a href="/usuarios.html" class="menu-item menu-usuarios"><span>👤</span> Usuarios</a>
            <a href="/pagos.html" class="menu-item"><span>💰</span> Pagos</a>
            <a href="/reportes.html" class="menu-item"><span>📊</span> Reportes</a>
            
        </div>
        <div class="sidebar-footer">
            <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h2>Gestión de Usuarios</h2>
            <p>Administra las cuentas del sistema</p>
        </div>

        <div class="card">
            <div class="card-header"><h3>➕ Crear nuevo usuario</h3></div>
            <div id="msg" class="msg"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre de usuario</label>
                    <input type="text" id="username" placeholder="Ej: recepcion1">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                </div>
                <button class="btn-primary" onclick="crearUsuario()">Crear</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>👤 Usuarios del sistema</h3>
                <span id="totalBadge" style="background:#ffeef1;color:#e94560;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;">0 usuarios</span>
            </div>
            <table>
                <thead>
                    <tr><th>Usuario</th><th>Rol</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function verificarSesion() {
            const res = await fetch('/api/sesion');
            if (!res.ok) window.location.href = '/login.html';
        }

        async function cerrarSesion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function cargarUsuarios() {
            const res = await fetch('/api/usuarios');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const data = await res.json();
            document.getElementById('totalBadge').textContent = data.length + ' usuarios';
            document.getElementById('tabla').innerHTML = data.map(u => `
                <tr>
                    <td><span class="avatar">${u.username.charAt(0).toUpperCase()}</span><strong>${u.username}</strong></td>
                    <td><span class="${u.username === 'admin' ? 'badge-admin' : 'badge-user'}">${u.username === 'admin' ? '👑 Admin' : '👤 Usuario'}</span></td>
                    <td>${u.username !== 'admin' ? `<button class="btn-delete" onclick="eliminarUsuario(${u.id}, '${u.username}')">🗑️ Eliminar</button>` : '-'}</td>
                </tr>
            `).join('');
        }

        async function crearUsuario() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');
            if (!username || !password) { msg.className = 'msg err'; msg.textContent = 'Completa todos los campos.'; return; }
            if (password.length < 6) { msg.className = 'msg err'; msg.textContent = 'La contraseña debe tener mínimo 6 caracteres.'; return; }
            const res = await fetch('/api/usuarios', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.className = 'msg ok'; msg.textContent = '✅ Usuario creado correctamente.';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                cargarUsuarios();
            } else { msg.className = 'msg err'; msg.textContent = '❌ ' + data.error; }
        }

        async function eliminarUsuario(id, username) {
            if (!confirm(`¿Eliminar al usuario "${username}"?`)) return;
            const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) cargarUsuarios();
            else alert('❌ ' + data.error);
        }

        verificarSesion();
        cargarUsuarios();
    </script>
</body>
</html>
