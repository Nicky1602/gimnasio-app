<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - GymManager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a1a2e; min-height: 100vh; padding: 24px 0; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 0 24px 32px; border-bottom: 1px solid #ffffff15; }
        .sidebar-logo h1 { color: #e94560; font-size: 20px; }
        .sidebar-logo p { color: #aaa; font-size: 12px; margin-top: 4px; }
        .sidebar-menu { padding: 24px 0; flex: 1; }
        .menu-item { padding: 12px 24px; color: #aaa; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all .2s; text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: #e9456015; color: #e94560; border-left: 3px solid #e94560; }
        .menu-item span { font-size: 18px; }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid #ffffff15; }
        .sidebar-footer button { width: 100%; background: transparent; border: 1px solid #e94560; color: #e94560; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .sidebar-footer button:hover { background: #e94560; color: white; }
        .main { flex: 1; padding: 32px; }
        .topbar { margin-bottom: 32px; }
        .topbar h2 { font-size: 22px; color: #1a1a2e; }
        .topbar p { color: #888; font-size: 13px; margin-top: 2px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .stat-icon.red { background: #ffeef1; }
        .stat-icon.green { background: #eefff5; }
        .stat-icon.blue { background: #eef4ff; }
        .stat-info h3 { font-size: 26px; color: #1a1a2e; font-weight: 700; }
        .stat-info p { color: #888; font-size: 13px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { font-size: 16px; color: #1a1a2e; font-weight: 600; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 10px 14px; text-align: left; font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #f0f0f0; }
        td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #f9f9f9; }
        tr:hover td { background: #fafafa; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e9456020; color: #e94560; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <h1>💪 GymManager</h1>
            <p>Panel de administración</p>
        </div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><span>👥</span> Socios</a>
            <a href="/membresias.html" class="menu-item"><span>💳</span> Membresías</a>
            <a href="/pagos.html" class="menu-item"><span>💰</span> Pagos</a>
            <a href="/reportes.html" class="menu-item active"><span>📊</span> Reportes</a>
            <a href="/usuarios.html" class="menu-item"><span>👤</span> Usuarios</a>
        </div>
        <div class="sidebar-footer">
            <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h2>Reportes y Estadísticas</h2>
            <p>Resumen general del gimnasio</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon red">👥</div>
                <div class="stat-info">
                    <h3 id="statSocios">-</h3>
                    <p>Total de socios</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">💰</div>
                <div class="stat-info">
                    <h3 id="statIngresos">-</h3>
                    <p>Ingresos totales</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">📅</div>
                <div class="stat-info">
                    <h3 id="statMes">-</h3>
                    <p>Ingresos este mes</p>
                </div>
            </div>
        </div>

        <div class="grid2">
            <div class="card">
                <h3>📊 Membresías más populares</h3>
                <canvas id="chartMembresias"></canvas>
            </div>
            <div class="card">
                <h3>👥 Socios recientes</h3>
                <table>
                    <thead><tr><th>Socio</th><th>Registro</th></tr></thead>
                    <tbody id="tablaSocios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function verificarSesion() {
            const res = await fetch('/api/sesion');
            if (!res.ok) window.location.href = '/login.html';
        }

        async function cerrarSesion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function cargarReportes() {
            const res = await fetch('/api/reportes');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const data = await res.json();

            document.getElementById('statSocios').textContent = data.totalSocios;
            document.getElementById('statIngresos').textContent = 'S/.' + parseFloat(data.totalIngresos).toFixed(2);
            document.getElementById('statMes').textContent = 'S/.' + parseFloat(data.pagosMes).toFixed(2);

            // Gráfica
            if (data.membresiasPopulares.length > 0) {
                new Chart(document.getElementById('chartMembresias'), {
                    type: 'doughnut',
                    data: {
                        labels: data.membresiasPopulares.map(m => m.nombre),
                        datasets: [{
                            data: data.membresiasPopulares.map(m => m.cantidad),
                            backgroundColor: ['#e94560', '#0f3460', '#f0a500', '#27ae60', '#8e44ad'],
                            borderWidth: 0
                        }]
                    },
                    options: { plugins: { legend: { position: 'bottom' } }, cutout: '65%' }
                });
            } else {
                document.getElementById('chartMembresias').parentElement.innerHTML += '<p style="color:#aaa;font-size:13px;text-align:center;margin-top:20px;">Sin datos de pagos aún</p>';
            }

            // Tabla socios recientes
            document.getElementById('tablaSocios').innerHTML = data.sociosRecientes.map(s => `
                <tr>
                    <td><span class="avatar">${s.nombre.charAt(0)}</span>${s.nombre}</td>
                    <td>${new Date(s.fecha_registro).toLocaleDateString('es-ES')}</td>
                </tr>
            `).join('');
        }

        verificarSesion();
        cargarReportes();
    </script>
</body>
</html>
