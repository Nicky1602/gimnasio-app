<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GymManager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('fondo.png'); background-size: cover; background-position: center; padding: 20px; }
        .card { width: 100%; max-width: 460px; background: rgba(23,25,30,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 50px 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .brand-logo { font-size: 42px; color: #ffc131; margin-bottom: 10px; }
        h1 { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { color: #9ca3af; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; color: #9ca3af; font-size: 14px; margin-bottom: 8px; }
        .form-group input { width: 100%; background: rgba(17,19,23,0.6); border: 1px solid #2d3139; border-radius: 8px; padding: 13px 16px; color: #fff; font-size: 14px; outline: none; transition: all .2s; }
        .form-group input:focus { border-color: #ffc131; box-shadow: 0 0 0 3px rgba(255,193,49,0.1); }
        .btn { width: 100%; background: #f5b932; color: #111; border: none; padding: 15px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all .2s; }
        .btn:hover { background: #e0a726; transform: translateY(-1px); }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; text-align: left; }
        .msg.err { background: #ffeef1; color: #e94560; display: block; border-left: 4px solid #e94560; }
        .msg.ok { background: #eefff5; color: #27ae60; display: block; border-left: 4px solid #27ae60; }
        .link { color: #9ca3af; font-size: 13px; margin-top: 20px; }
        .link a { color: #ffc131; text-decoration: none; }
        .codigo-box { background: #1a1a2e; border: 2px solid #ffc131; border-radius: 12px; padding: 20px; margin: 20px 0; display: none; }
        .codigo-box h3 { color: #ffc131; font-size: 14px; margin-bottom: 8px; }
        .codigo-box .codigo { color: #fff; font-size: 32px; font-weight: 700; letter-spacing: 6px; }
        .codigo-box p { color: #9ca3af; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-logo">❚█══█❚</div>
        <h1>GymManager</h1>
        <div class="subtitle">Registro de gimnasio</div>

        <div id="msg" class="msg"></div>

        <div id="codigoBox" class="codigo-box">
            <h3>🎉 ¡Registro exitoso! Tu código de acceso es:</h3>
            <div class="codigo" id="codigoValor"></div>
            <p>Guarda este código — lo necesitarás para iniciar sesión junto con tu usuario y contraseña.</p>
        </div>

        <div id="formulario">
            <div class="form-group">
                <label>Nombre del gimnasio</label>
                <input type="text" id="nombre" placeholder="Ej: GymFit Perú">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="contacto@migimnasio.com">
            </div>
            <div class="form-group">
                <label>Contraseña del administrador</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>
            <button class="btn" onclick="registrar()">Crear cuenta</button>
        </div>

        <div class="link">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></div>
    </div>

    <script>
        async function registrar() {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');
            if (!nombre || !email || !password) { msg.className = 'msg err'; msg.textContent = 'Completa todos los campos.'; return; }
            if (password.length < 6) { msg.className = 'msg err'; msg.textContent = 'La contraseña debe tener mínimo 6 caracteres.'; return; }
            const res = await fetch('/api/registro-gimnasio', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, password })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('formulario').style.display = 'none';
                document.getElementById('codigoValor').textContent = data.codigo;
                document.getElementById('codigoBox').style.display = 'block';
                msg.className = 'msg ok';
                msg.textContent = '✅ Cuenta creada. Guarda tu código y ve al login.';
                setTimeout(() => window.location.href = '/login.html', 5000);
            } else { msg.className = 'msg err'; msg.textContent = '❌ ' + data.error; }
        }
    </script>
</body>
</html>
